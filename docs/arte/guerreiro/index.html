<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../../"><title>Guerreiro — estudo de movimento</title><link rel="stylesheet" href="assets/styles/game.css"><link rel="stylesheet" href="assets/styles/campaign-hud.css"><link rel="stylesheet" href="assets/styles/campaign-theme.css"><link rel="stylesheet" href="assets/styles/character-motion.css"><style>body{background:#121014;color:#f1dfbb}main{max-width:1000px;margin:32px auto;padding:16px}h1{font-size:36px}.battle-scene{height:500px!important;background:url('assets/visual/backgrounds/regions/floresta.webp') center/cover}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,select{padding:12px;background:#34271a;color:#ffe8b5;border:1px solid #a98553}.debug .hero-v2{outline:1px solid #ffc75e}.debug .hero-v2:after{content:'';position:absolute;width:8px;height:8px;border:1px solid cyan;left:calc(50% - 4px);bottom:4px}.speed{font:14px system-ui}.note{color:#c8baa5}@media(max-width:760px){main{margin:10px auto}.battle-scene{height:360px!important}}</style></head><body class="rpg-campaign"><main><h1>Guerreiro — enquadramento e movimento</h1><p class="note">Poses individuais, alinhadas pelos pés, com transições adicionais entre os golpes. Ataque, Esbarrão, Recuperar Fôlego e reação ao dano para comparar dentro da batalha.</p><div class="rpg-battle"><div class="battle-scene"><div id="heroSpriteBox" class="combat-entity hero-entity"><div class="sprite-figure sheet-sprite hero-v2 warrior-single" data-warrior="true" role="img" aria-label="Guerreiro"></div></div><div id="enemySpriteBox" class="combat-entity enemy-entity"><div class="sprite-figure sheet-sprite" style="background-image:url('assets/visual/enemies-v3/lobo-sombrio.webp');background-size:400% 100%" role="img" aria-label="Lobo Sombrio"></div></div></div></div><div class="controls"><button data-action="basic">Ataque básico</button><button data-action="shove">Esbarrão</button><button data-action="support">Recuperar Fôlego</button><button data-action="camp">Descansar no acampamento</button><button data-action="hurt">Receber golpe</button><button id="bounds">Mostrar limites e apoio dos pés</button></div><label class="speed">Velocidade <select id="speed"><option value="1">Normal</option><option value="0.35">Câmera lenta</option></select></label><p id="status" role="status">Repouso</p></main><script>const player={class:'Guerreiro'};const slugify=s=>s.toLowerCase().replace(/\s+/g,'-');function pulseSpriteClass(){}</script><script src="assets/js/systems/character-motion.js"></script><script>
const hero=document.querySelector('.hero-v2');hero.style.setProperty('--sprite-url',`url('${new URL(CharacterMotion.heroPath('guerreiro'),document.baseURI).href}')`);
window.addEventListener('rpg-motion',e=>document.getElementById('status').textContent=e.detail.phase==='impact'?'Impacto':e.detail.phase==='end'?'Repouso':e.detail.phase);
async function play(id){document.querySelectorAll('button').forEach(b=>b.disabled=true);try{if(id==='camp'){hero.style.backgroundImage=`url('${new URL(CharacterMotion.heroPath('guerreiro-camp'),document.baseURI).href}')`;hero.dataset.pose='camp';document.getElementById('status').textContent='Descansando';}else if(id==='hurt')await CharacterMotion.hurt();else await CharacterMotion.action({style:id==='support'?'buff':'attack',skill:id==='shove'?{type:'warrior_shove',id:'esbarrao'}:id==='support'?{type:'warrior_second_wind',id:'recuperar_folego'}:null,connectHit:true});}finally{document.querySelectorAll('button').forEach(b=>b.disabled=false);}}
document.querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>play(b.dataset.action));document.getElementById('bounds').onclick=()=>document.body.classList.toggle('debug');document.getElementById('speed').onchange=e=>{document.timeline.getAnimations().forEach(a=>a.playbackRate=Number(e.target.value));window.warriorPreviewSpeed=Number(e.target.value);};
</script></body></html>
