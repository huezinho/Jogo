<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Arena - RPG por Turnos</title>
<link rel="stylesheet" href="assets/styles/game.css?v=visual-v20-20260520" />
<link rel="stylesheet" href="assets/styles/arena.css" />
</head>
<body class="arena-page">
<script>
window.IS_ARENA_PAGE = true;
</script>
<div class="container">
<div id="classSelect" class="panel start-panel"></div>
<div id="game" style="display:none;">
<div class="panel" style="margin-bottom:18px;">
<h2>Arena dos Campeoes</h2>
<p class="lock-note">Monte uma sala de duelo, enfrente outro jogador e deixe a iniciativa aleatoria decidir quem abre o combate.</p>
</div>
<div class="game-layout">
<div class="side-column">
<div class="panel">
<h3>Locais</h3>
<div class="tabs" id="modeTabs"></div>
</div>
<div class="panel hero-portrait-panel" id="heroPortraitPanel"></div>
</div>
<div class="main-column">
<div class="panel" id="playerInfo"></div>
<div class="button-row" id="actions"></div>
<div class="panel" id="enemyInfo"></div>
<div id="levelUpPanel" class="panel levelup-panel" style="display:none;"></div>
<div class="panel" id="logPanel">
<div class="panel-header">
<strong>Log de batalha</strong>
<button onclick="toggleLog()">Ocultar</button>
</div>
<div id="log"></div>
</div>
</div>
<div class="side-column">
<div class="panel" id="regionInfo"></div>
<div class="panel" id="inventoryInfo"></div>
</div>
</div>
</div>
</div>
<button id="settingsFab" class="settings-fab" onclick="toggleSettingsPanel()">Configuracao</button>
<div id="settingsPanel" class="panel settings-panel" style="display:none;"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="assets/js/data/system-data.js"></script>
<script src="assets/js/data/world-data.js"></script>
<script src="assets/js/data/class-trees.js"></script>
<script src="assets/js/systems/dungeon-shared.js"></script>
<script src="assets/js/systems/page-navigation.js"></script>
<script src="assets/js/systems/achievement-system.js?v=trophy-map-v4-20260520"></script>
<script src="assets/js/game.js?v=visual-v20-20260520"></script>
<script src="assets/js/systems/arena-system.js"></script>
</body>
</html>
